name: Refresh recent projects

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - assets/**
      - .github/workflows/update-projects.yml

permissions:
  contents: write

concurrency:
  group: refresh-recent-projects
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Test project generator
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_projects.py
      - name: Commit changes when projects change
        run: |
          git add README.md assets/projects
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Update recent projects"
          git push
